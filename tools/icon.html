<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../css/fonts.css">
<style>
html,body{margin:0;width:1024px;height:1024px;background:transparent;overflow:hidden}
.ic{position:absolute;left:100px;top:100px;width:824px;height:824px;border-radius:185px;overflow:hidden;
  background:radial-gradient(circle at 50% 30%,#2a3558 0%,#0b0f1c 62%,#05070d 100%);box-shadow:0 20px 40px rgba(0,0,0,.35)}
.sun{position:absolute;left:212px;top:120px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,#ffb35a 0%,#f0703a 55%,rgba(240,112,58,0) 72%);opacity:.85}
.road{position:absolute;left:-40px;right:-40px;bottom:-40px;height:380px;background:linear-gradient(#3a3a42,#1c1c22);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}
.line{position:absolute;left:50%;bottom:0;width:18px;height:340px;margin-left:-9px;background:repeating-linear-gradient(#f2efe6 0 40px,transparent 40px 80px);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}
.kerbL,.kerbR{position:absolute;bottom:-40px;width:60px;height:380px;background:repeating-linear-gradient(#c3221f 0 34px,#eee 34px 68px)}
.kerbL{left:120px;transform:skewX(26deg)}.kerbR{right:120px;transform:skewX(-26deg)}
.t{position:absolute;left:0;right:0;top:250px;text-align:center;font-family:'Pirata One';font-size:360px;line-height:1;color:#fff;
  text-shadow:10px 10px 0 #000,-10px -10px 0 #000,10px -10px 0 #000,-10px 10px 0 #000,0 10px 0 #000,10px 0 0 #000,0 -10px 0 #000,-10px 0 0 #000,0 22px 0 rgba(0,0,0,.5)}
.band{position:absolute;left:150px;right:150px;top:600px;height:96px;background:#000;transform:skewX(-12deg);border-top:8px solid #e8b13a;border-bottom:8px solid #e8b13a;
  display:flex;align-items:center;justify-content:center}
.band span{transform:skewX(12deg);font-family:'Anton';font-size:74px;letter-spacing:22px;color:#e8b13a;padding-left:22px}
</style></head><body>
<div class="ic"><div class="sun"></div><svg width="824" height="824" viewBox="0 0 824 824" style="position:absolute;left:0;top:0">
<defs><pattern id="k" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><rect width="40" height="20" fill="#c3221f"/><rect y="20" width="40" height="20" fill="#eee"/></pattern>
<linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a32"/><stop offset="1" stop-color="#3c3c46"/></linearGradient></defs>
<polygon points="372,470 452,470 824,824 0,824" fill="url(#r)"/>
<polygon points="372,470 386,470 60,824 0,824" fill="url(#k)"/>
<polygon points="438,470 452,470 824,824 764,824" fill="url(#k)"/>
<polygon points="409,470 415,470 424,824 400,824" fill="#f2efe6" opacity=".9"/>
</svg>
<div class="t">SV</div><div class="band"><span>GP</span></div></div>
</body></html>
