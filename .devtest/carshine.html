<!doctype html>
<html><head><meta charset="utf-8"><title>Car shine</title>
<style>body{margin:0;background:#111}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
</head><body>
<script type="module">
// dev: the livery cars lit as on a day track (world.js's day lights + carsky.js reflections), three views per car.
// ?cars=m1procar,civic&old=1 (old = the previous matt Phong and no auto smooth, for before / after). window.done when drawn.
import * as THREE from 'three';
import { buildF1 } from '../js/carmodel.js';
import { loadRoadCar } from '../js/roadcar.js';
import { CARS } from '../js/cars.js';
const P = new URLSearchParams(location.search), ids = (P.get('cars') || 'm1procar').split(','), old = P.get('old') === '1';
if (old) for (const id of ids) CARS[id].smooth = 0;
window.__SVGP_CARS = Object.fromEntries(ids.map(id => [id, '../models/cars/' + id + '.glb']));
for (const id of ids) await loadRoadCar(id);
const LIV = { main: 0xf2f2f2, accent: 0xd01020, third: 0x1a1a1a, pattern: 'stripe', number: 27, sponsor: 'Velo', showNumber: true, showSponsor: true, decals: [] };
const views = { fl: [4.2, 1.5, 4.6], side: [6.5, 0.9, 0.3], rl: [-4.2, 1.7, -4.6] }, vk = Object.keys(views);
const TW = 560, TH = 340, W = TW * vk.length, H = TH * ids.length;
const Rd = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
Rd.setSize(W, H); Rd.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(Rd.domElement); Rd.setScissorTest(true);
ids.forEach((id, row) => {
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xb8d4f4, 0x5e5238, 0.68));
  const sun = new THREE.DirectionalLight(0xfff0d6, 1.7); sun.position.set(45, 75, 35); scene.add(sun);
  const m = buildF1({ chassis: id, ...LIV }, { texSize: 1024 });
  if (old) m.group.traverse(o => { if (o.isMesh && o.material.envMap) { const a = o.material, b = new THREE.MeshPhongMaterial({ map: a.map, color: a.color, side: a.side, alphaTest: a.alphaTest, transparent: a.transparent, specular: 0x4a4a4a, shininess: 70 }); o.material = b; } });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshLambertMaterial({ color: 0x55585c })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
  scene.add(m.group);
  const bb = new THREE.Box3().setFromObject(m.body), ctr = bb.getCenter(new THREE.Vector3()), size = bb.getSize(new THREE.Vector3());
  vk.forEach((v, col) => {
    const cam = new THREE.PerspectiveCamera(28, TW / TH, 0.1, 100), p = views[v];
    cam.position.set(ctr.x + p[0], p[1], ctr.z + p[2]); cam.lookAt(ctr.x, size.y * 0.42, ctr.z);
    const x = col * TW, y = H - (row + 1) * TH;
    Rd.setViewport(x, y, TW, TH); Rd.setScissor(x, y, TW, TH); Rd.setClearColor(0xa9c4dc); Rd.clear(); Rd.render(scene, cam);
  });
});
window.done = true;
</script></body></html>
