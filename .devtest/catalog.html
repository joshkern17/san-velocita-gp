<!doctype html>
<html><head><meta charset="utf-8"><title>Asset catalog</title>
<style>body{margin:0;background:#223;overflow:hidden}canvas{display:block}#t{position:fixed;left:8px;top:6px;color:#fff;font:bold 16px monospace;text-shadow:0 0 3px #000}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
</head><body><div id="t"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../vendor/addons/loaders/GLTFLoader.js';
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
R.setSize(innerWidth, innerHeight); R.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(R.domElement);
const label = (txt) => {
  const c = document.createElement('canvas'); c.width = 256; c.height = 48; const g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,.7)'; g.fillRect(0, 0, 256, 48); g.fillStyle = '#ff0'; g.font = 'bold 22px monospace'; g.fillText(txt.slice(0, 20), 6, 32);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false })); s.renderOrder = 9; return s;
};
// tiles(url, { from, to, cols, yaw }): one framed thumbnail per piece, viewed from the front-right (+Z = front)
const ov = document.createElement('canvas'); ov.style.cssText = 'position:fixed;left:0;top:0;pointer-events:none'; ov.width = innerWidth; ov.height = innerHeight; document.body.appendChild(ov);
window.show = async (url, o = {}) => {
  const g = await new GLTFLoader().loadAsync(url);
  let kids = [...g.scene.children];
  if (o.from !== undefined) kids = kids.slice(o.from, o.to);
  if (o.filter) kids = kids.filter(k => o.filter.includes(k.name));
  const n = kids.length, cols = o.cols || Math.ceil(Math.sqrt(n * innerWidth / innerHeight)), rows = Math.ceil(n / cols);
  const tw = Math.floor(innerWidth / cols), th = Math.floor(innerHeight / rows);
  R.setScissorTest(true); R.setClearColor(0x3a4050); R.clear();
  const ctx = ov.getContext('2d'); ctx.clearRect(0, 0, ov.width, ov.height); ctx.font = 'bold 12px monospace';
  const info = [];
  kids.forEach((k, i) => {
    const scene = new THREE.Scene();
    scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.7)); const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(3, 6, 4); scene.add(sun);
    k.position.set(0, 0, 0); scene.add(k);
    const box = new THREE.Box3().setFromObject(k), sz = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
    const r = Math.max(0.05, sz.length() / 2);
    const cam = new THREE.PerspectiveCamera(35, tw / th, r / 50, r * 50);
    const yaw = (o.yaw ?? 35) * Math.PI / 180, el = 22 * Math.PI / 180, d = r / Math.sin(17 * Math.PI / 180) * 1.05;
    cam.position.set(c.x + Math.sin(yaw) * Math.cos(el) * d, c.y + Math.sin(el) * d, c.z + Math.cos(yaw) * Math.cos(el) * d); cam.lookAt(c);
    const x = (i % cols) * tw, y = innerHeight - (Math.floor(i / cols) + 1) * th;
    R.setViewport(x, y, tw, th); R.setScissor(x, y, tw, th); R.setClearColor(i % 2 ? 0x3a4050 : 0x343a48); R.clear(); R.render(scene, cam);
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x, innerHeight - y - th, tw, 30);
    ctx.fillStyle = '#ff0'; ctx.fillText(k.name.slice(0, Math.floor(tw / 7.3)), x + 3, innerHeight - y - th + 12);
    ctx.fillStyle = '#9ef'; ctx.fillText(sz.toArray().map(v => v.toFixed(1)).join('x'), x + 3, innerHeight - y - th + 26);
    info.push(k.name + ' ' + sz.toArray().map(v => v.toFixed(1)).join('x'));
  });
  R.setScissorTest(false);
  document.getElementById('t').textContent = '';
  return info.length;
};
window.ready = true;
</script></body></html>
