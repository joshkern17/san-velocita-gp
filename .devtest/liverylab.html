<!doctype html>
<html><head><meta charset="utf-8"><title>Livery lab</title>
<style>body{margin:0;background:#111}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
</head><body>
<script type="module">
// dev: stress-test liveries on the livery cars (roadcar.js), unlit, from six sides. ?car=civic&set=grid,stripe,team
// One row per test livery, one column per view. window.done when drawn.
import * as THREE from 'three';
import { buildF1 } from '../js/carmodel.js';
import { loadRoadCar } from '../js/roadcar.js';
import { assets, decalImage } from '../js/livery.js';
const P = new URLSearchParams(location.search), id = P.get('car') || 'civic';
for (const k of (P.get('g') || '').split(',').filter(Boolean)) globalThis[k] = true; // (dev switches: NOSHEAR, NOFLOAT, NOTILT...)
const sets = (P.get('set') || 'grid,stripe,team').split(',');
window.__SVGP_CARS = { [id]: (P.get('dir') || '../models/cars/') + id + '.glb' }; // (dir: try other builds of the car)
await loadRoadCar(id);

// a grid picture: hue across, light down, black lines every cell (shows stretch, tears and seams)
function gridImage(cols, rows) {
  const c = document.createElement('canvas'), k = 48; c.width = cols * k; c.height = rows * k; const g = c.getContext('2d');
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) { g.fillStyle = `hsl(${i / cols * 300},85%,${(i + j) % 2 ? 45 : 62}%)`; g.fillRect(i * k, j * k, k, k); }
  g.strokeStyle = '#000'; g.lineWidth = 4; for (let i = 0; i <= cols; i++) { g.beginPath(); g.moveTo(i * k, 0); g.lineTo(i * k, c.height); g.stroke(); } for (let j = 0; j <= rows; j++) { g.beginPath(); g.moveTo(0, j * k); g.lineTo(c.width, j * k); g.stroke(); }
  return c.toDataURL();
}
assets.put('gridW', gridImage(30, 10)); assets.put('gridS', gridImage(12, 12));
for (const k of ['gridW', 'gridS']) await new Promise(r => { if (decalImage(k, r)) r(); });
const rect = (w, h) => ({ w, closed: true, n: [[-w / 2, -h / 2, 0, 0, 0, 0], [w / 2, -h / 2, 0, 0, 0, 0], [w / 2, h / 2, 0, 0, 0, 0], [-w / 2, h / 2, 0, 0, 0, 0]] });
const shape = (panel, x, y, w, h, fill, rot = 0, mirror = true) => ({ id: 'd' + Math.random(), panel, x, y, size: w, rot, opacity: 1, mirror, flip: false, path: rect(w, h), fill, stroke: null, sw: 0 });
const img = (panel, x, y, size, asset, rot = 0, mirror = true) => ({ id: 'd' + Math.random(), panel, x, y, size, rot, opacity: 1, mirror, flip: false, asset });

const probe = buildF1({ chassis: id, main: 0xf2f2f2 }, {}), pn = probe.def.panels;
const S = pn.sideL, T = pn.top, F = pn.front, R = pn.rear;
const LIV = {
  grid: { main: 0xf2f2f2, accent: 0xf2f2f2, third: 0x222222, pattern: 'solid', showNumber: false, showSponsor: false, decals: [
    img('sideL', S.W * 0.5, S.H * 0.55, S.W * 0.96, 'gridW'), img('top', T.W * 0.5, T.H * 0.5, T.H * 0.96, 'gridW', 90, false),
    img('front', F.W * 0.5, F.H * 0.6, F.W * 0.95, 'gridS', 0, false), img('rear', R.W * 0.5, R.H * 0.6, R.W * 0.95, 'gridS', 0, false)] },
  stripe: { main: 0xf2f2f2, accent: 0xf2f2f2, third: 0x222222, pattern: 'solid', showNumber: false, showSponsor: false, decals: [
    shape('top', T.W * 0.5, T.H * 0.5, 0.36, T.H * 1.05, 0x1040d0, 0, false),
    shape('sideL', S.W * 0.5, S.H * 0.62, S.W * 1.05, 0.14, 0xd01020),
    shape('sideL', S.W * 0.5, S.H * 0.35, S.W * 1.05, 0.06, 0x10a040),
    shape('sideL', S.W * 0.3, S.H * 0.3, 0.25, 1.4, 0xe0a000, 35),
    shape('sideL', S.W * 0.72, S.H * 0.45, 0.3, 1.6, 0x8020d0, -20),
    shape('front', F.W * 0.5, F.H * 0.6, 0.36, F.H, 0x1040d0, 0, false), shape('rear', R.W * 0.5, R.H * 0.6, 0.36, R.H, 0x1040d0, 0, false)] },
  deck: { main: 0xf2f2f2, accent: 0xf2f2f2, third: 0x222222, pattern: 'solid', showNumber: false, showSponsor: false, decals: [img('top', T.W * 0.5, T.H * 0.82, T.W * 0.9, 'gridS', 0, false)] },
  stock: { paint: 'stock', main: 0xf2f2f2, showNumber: false, showSponsor: false, decals: [] },
  plain: { main: 0x2050c0, accent: 0x2050c0, third: 0x222222, pattern: 'solid', showNumber: false, showSponsor: false, decals: [] },
  team: { main: 0xf2f2f2, accent: 0xd01020, third: 0x1a1a1a, pattern: 'stripe', number: 27, sponsor: 'Velo', showNumber: true, showSponsor: true, decals: [] },
};
const views = { fl: [4.2, 1.7, 4.6], side: [6.5, 1.0, 0], top: [0.01, 8, 0], rl: [4.2, 1.9, -4.6], front: [0, 1.1, 6.5], rear: [0, 1.3, -6.5], right: [-6.5, 1.0, 0] };
const vk = (P.get('views') || 'fl,side,top,rl,front,rear').split(',');
const TW = +(P.get('tw') || 520), TH = +(P.get('th') || 340), W = TW * vk.length, H = TH * sets.length;
const Rd = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
Rd.setSize(W, H); Rd.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(Rd.domElement); Rd.setScissorTest(true);
sets.forEach((s, row) => {
  const scene = new THREE.Scene();
  const m = buildF1({ chassis: id, ...LIV[s], scheme: s === 'team' ? (P.get('scheme') || undefined) : undefined }, { texSize: 2048 });
  // unlit: the texture as painted
  m.body.traverse(o => { if (o.isMesh && o.material.map) o.material = new THREE.MeshBasicMaterial({ map: o.material.map, side: o.material.side, alphaTest: o.material.alphaTest, transparent: o.material.transparent }); });
  scene.add(new THREE.AmbientLight(0xffffff, 2)); scene.add(m.group);
  const bb = new THREE.Box3().setFromObject(m.body), ctr = bb.getCenter(new THREE.Vector3()), size = bb.getSize(new THREE.Vector3());
  vk.forEach((v, col) => {
    const top = v === 'top', cam = top ? new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 50) : new THREE.PerspectiveCamera(28, TW / TH, 0.1, 100);
    const p = views[v]; const zk = +(P.get('zoom') || 1); cam.position.set(ctr.x + p[0] * (top ? 1 : zk), p[1] * (top ? 1 : 0.9), ctr.z + p[2] * zk);
    if (top) { const a = TW / TH, h = size.z * 0.56; cam.left = -h * a; cam.right = h * a; cam.top = h; cam.bottom = -h; cam.up.set(1, 0, 0); cam.updateProjectionMatrix(); }
    cam.lookAt(ctr.x, top ? 0 : size.y * 0.42, ctr.z);
    const x = col * TW, y = H - (row + 1) * TH;
    Rd.setViewport(x, y, TW, TH); Rd.setScissor(x, y, TW, TH); Rd.setClearColor(0x30343c); Rd.clear(); Rd.render(scene, cam);
  });
});
window.done = true;
</script></body></html>
